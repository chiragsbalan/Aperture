name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege for GITHUB_TOKEN (jobs only need to read the repo).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # Throwaway local-only credentials for the CI service container.
          # Do not reuse this password shape for cloud or shared environments.
          POSTGRES_USER: aperture
          POSTGRES_PASSWORD: aperture
          POSTGRES_DB: aperture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aperture -d aperture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://aperture:aperture@localhost:5432/aperture
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Set up Python
        working-directory: backend
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --all-extras --frozen

      - name: Ruff check
        run: uv run ruff check app tests scripts migrations

      - name: Ruff format
        run: uv run ruff format --check app tests scripts migrations

      - name: Mypy
        run: uv run mypy app

      - name: Import linter
        run: uv run lint-imports

      - name: Alembic single head
        run: uv run python scripts/check_alembic_heads.py

      - name: Unit tests
        run: uv run pytest -m 'not integration'

      - name: Integration tests
        run: uv run pytest -m integration

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Enable pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: Prettier
        run: pnpm format:check

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          API_URL: http://localhost:8000
          NEXT_PUBLIC_API_URL: http://localhost:8000

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Accessibility (axe shell)
        run: pnpm a11y
        env:
          API_URL: http://127.0.0.1:9

  docker:
    name: Docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./backend
          file: ./backend/docker/Dockerfile
          push: false
          tags: aperture-api:ci
          cache-from: type=gha
          # Read cache on PRs; only write on push to avoid untrusted PR cache poisoning.
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max' || '' }}
