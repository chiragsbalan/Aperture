name: Bug report
description: Report something that is broken or unexpected
title: 'bug: '
labels: ['bug']
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps, expected vs actual.
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Local Compose, production URL, browser, OS, etc.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Extra context
      description: Logs, screenshots, related PRs (redact secrets).
    validations:
      required: false
