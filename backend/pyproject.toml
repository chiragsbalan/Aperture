[project]
name = "aperture-backend"
version = "0.1.0"
description = "Aperture FastAPI backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "alembic>=1.18.5",
  "uuid-utils>=0.17.0",
  "argon2-cffi>=25.1.0",
  "pyjwt[crypto]>=2.13.0",
  "pydantic[email]>=2.13.4",
  "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pre-commit>=4.0.0",
  "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.wheel.force-include]
"app/metadata/fixtures" = "app/metadata/fixtures"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: requires a reachable Postgres (Compose or CI service)",
]

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Layered modular monolith"
type = "layers"
containers = ["app"]
# Minimal P0 contract — not full modular-monolith enforcement yet.
# Higher layers may import lower ones, not the reverse.
# (domains) is optional until domain packages land; add forbidden/independence
# contracts for cross-domain repository isolation when domains exist.
# Higher may import lower. ``|`` marks independent siblings (no cross-imports).
# Auth may call Users service; Users must not depend on Auth.
# Users and Metadata are independent siblings.
layers = [
  "api",
  "auth",
  "users | metadata",
  "common | core",
]

[[tool.importlinter.contracts]]
name = "Users must not import Auth"
type = "forbidden"
source_modules = ["app.users"]
forbidden_modules = [
  "app.auth",
  "app.auth.repository",
  "app.auth.service",
  "app.auth.api",
  "app.auth.models",
]

[[tool.importlinter.contracts]]
name = "Users must not import Metadata"
type = "forbidden"
source_modules = ["app.users"]
forbidden_modules = ["app.metadata"]

[[tool.importlinter.contracts]]
name = "Metadata must not import Users"
type = "forbidden"
source_modules = ["app.metadata"]
forbidden_modules = ["app.users"]

[[tool.importlinter.contracts]]
name = "Metadata must not import Auth"
type = "forbidden"
source_modules = ["app.metadata"]
forbidden_modules = ["app.auth"]
